# Supabase 무료 플랜은 7일 동안 요청이 없으면 프로젝트를 정지시킨다.
# 정지되면 참가자가 로그인도 저장도 못 한다. 매일 한 번 가볍게 찔러서 깨어 있게 둔다.
#
# 쓰는 키는 config.js에 이미 공개되어 있는 anon 키라 비밀값이 아니다.
# 권한 규칙(RLS) 때문에 이 요청으로는 아무 데이터도 읽히지 않는다.

name: Supabase 깨워두기

on:
  schedule:
    - cron: '0 3 * * *' # 매일 12:00 (한국 시간)
  workflow_dispatch: # 필요하면 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 프로젝트에 요청 보내기
        run: |
          URL="https://vvuxqnjeawujkbudhxhy.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2dXhxbmplYXd1amtidWRoeGh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTUxMTcsImV4cCI6MjEwNTc5MTExN30.VQE1VvuCVYzyS9nD52xk-l5yb-rZ-6qo3eMEVn3vhwo"

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/items?select=id&limit=1")

          echo "응답 코드: $code"

          # 200이면 정상. RLS 때문에 빈 배열이 돌아오는 것이 정상 동작이다.
          if [ "$code" != "200" ]; then
            echo "::warning::예상과 다른 응답입니다. 프로젝트가 정지되었을 수 있습니다."
            exit 1
          fi
